#
# Overrides on top of detekt's default configuration (buildUponDefaultConfig), shared by every
# module through the convention plugins. Keep this list short and justify every entry.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true

naming:
  MatchingDeclarationName:
    # A screen file holds its ViewModel next to its composables.
    active: false
  FunctionNaming:
    # Composables are PascalCase by Compose API guidelines.
    ignoreAnnotated:
      - Composable

complexity:
  LongMethod:
    # The contract fake server routes every endpoint in one table.
    excludes:
      - '**/testFixtures/**'
    # A screen composable is one declarative tree; splitting it only moves the length around.
    ignoreAnnotated:
      - Composable
  CyclomaticComplexMethod:
    # A screen is one declarative tree with a branch per state; splitting it only moves the length.
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    # Format codecs and repositories group one small function per wire field or operation;
    # splitting them across files would scatter one format over several places.
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInObjects: 25
    thresholdInInterfaces: 25
  LongParameterList:
    # Composables expose many optional parameters with defaults and one callback per intent (a
    # stateless screen takes its state and its callbacks, which is the point); the contract's
    # canonical request has six fields and is built in one call.
    ignoreAnnotated:
      - Composable
    ignoreDefaultParameters: true
    functionThreshold: 7
    # Room entities and their row models mirror the table columns one to one.
    constructorThreshold: 8

style:
  MaxLineLength:
    # The same limit as ktlint's official code style (140), so the two tools never disagree.
    maxLineLength: 140
  ThrowsCount:
    # Binary-format readers reject each malformed field with a guard clause.
    excludeGuardClauses: true
  UnusedPrivateMember:
    # Private @Preview functions are only referenced by the IDE.
    ignoreAnnotated:
      - Preview
  MagicNumber:
    # Named constants and property declarations (parameter tables) are the definition itself.
    ignorePropertyDeclaration: true
    ignoreEnums: true
    # dp and sp literals of a layout are the layout.
    ignoreAnnotated:
      - Composable
    # detekt's default test exclusions, plus color and typography tokens,
    # which are literal values by nature.
    excludes:
      - '**/test/**'
      - '**/testFixtures/**'
      - '**/androidTest/**'
      - '**/*.kts'
      - '**/ui/theme/**'
