# The language of res/values (the default resources). With this file, the Android Gradle plugin
# generates res/xml/locales_config.xml from the values-xx folders (see androidResources.generateLocaleConfig)
# and lists it in the manifest as android:localeConfig, so a new language is one new values-xx folder.
unqualifiedResLocale=en-US
