# Kept small on purpose (the author's machine runs other things): one daemon of 2 GB, the
# Kotlin compiler inside it instead of a second daemon, and at most two workers. Metaspace is 1.5 GB:
# the in-process Kotlin compiler, lint, Kover and Robolectric together outgrew 768 MB (the daemon
# restarted itself between tasks and `check` died with OutOfMemoryError: Metaspace).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
