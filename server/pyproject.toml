[project]
name = "ultimateotp"
version = "0.1.0"
description = "Self-hosted end-to-end encrypted OTP sync server (blob store, never sees plaintext)"
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
# Few, well-known dependencies (docs/design.md §4.2). PyNaCl only verifies Ed25519 signatures:
# the server never decrypts anything.
dependencies = [
  "fastapi>=0.143",
  "pydantic>=2.14",
  "pydantic-settings>=2.15",
  "pynacl>=1.5",
  "uvicorn>=0.54",
]

[project.scripts]
ultimateotp = "ultimateotp.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "openapi-spec-validator>=0.9",
  "pytest>=9.1",
  "pyyaml>=6.0",
  "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultimateotp"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "S", "BLE",
  "T20", "PT", "RUF", "ASYNC", "TRY", "PL", "DTZ", "LOG", "G", "INP",
]
ignore = [
  # Exception messages are written inline; a custom class per message adds nothing.
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed fake values by nature.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = [
  "error",
  # Starlette's TestClient prefers httpx2; httpx is the approved client.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
